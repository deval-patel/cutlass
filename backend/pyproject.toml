[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax for py311+)
    "B",   # flake8-bugbear (likely bugs)
    "BLE", # blind excepts must be explicit
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules (incl. unused noqa)
]
ignore = [
    "B008", # FastAPI dependency injection uses calls in parameter defaults (File(...), Body(...))
]

[tool.ruff.lint.per-file-ignores]
# conftest pins env vars before importing the app — late imports are the point.
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["data", ".venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
