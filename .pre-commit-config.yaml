# Local pre-commit hooks (CI runs the same checks on every PR):
#   pip install pre-commit && pre-commit install
# Faster day-to-day alternative: run the tools directly —
#   backend:  ruff check --fix . && ruff format . && mypy app
#   frontend: npm run lint && npx prettier --write src
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff-format (backend)
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|tsx|css|json|html|js)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
